name: Feature request
description: Suggest an idea or improvement for one of the plugins
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options:
        - Gear Effects Display
        - Immersive Cooking
        - Keybind Tile Highlight
        - Lively Fishing Spots
        - Poison Ring
        - Skill Bubbles
        - Tab Keybind Display
        - Trawling Plus
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: What are you trying to do that the plugin doesn't help with yet?
